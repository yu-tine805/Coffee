<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>每日學習狀況｜Study Ledger</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <a class="brand" href="index.html"><span>✎</span> STUDY LEDGER</a>
      <nav>
        <a href="index.html">Home</a
        ><a class="active" href="daily.html">每日學習狀況</a
        ><a href="questions.html">問題盒子 <b id="questionCount">0</b></a>
      </nav>
    </header>
    <main class="page">
      <p class="kicker">02 / DAILY STUDY STATUS</p>
      <h1>今天有沒有<br /><em>跟上進度？</em></h1>
      <p class="lead">
        把一週的學習狀態攤開來看，比「我好像都有讀」更接近事實。
      </p>
      <section class="table-wrap">
        <div class="study-section">
          <div class="study-header">
            <h2>每日學習狀況追蹤</h2>

            <div class="add-subject">
              <input type="text" placeholder="輸入科目" />
              <button class="add-text">加入</button>
            </div>
          </div>

          <div class="study-table" id="study"></div>

          <div class="study-save-row">
            <button id="saveDailyStudy">儲存今日學習紀錄</button>
          </div>
        </div>

        <div class="weekly-detail-section">
          <div class="weekly-detail-divider"></div>

          <div class="weekly-detail-header">
            <p class="kicker">THIS WEEK</p>

            <h2>本週學習狀況明細</h2>

            <p>每天儲存的學習紀錄會留在這裡，直到進入下一週。</p>

            <button
              id="studyTrashButton"
              class="study-trash-button"
              type="button"
              aria-label="開啟已刪除的學習明細"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 7h14"></path>
                <path d="M9 7V4h6v3"></path>
                <path d="M7 7l1 13h8l1-13"></path>
                <path d="M10 11v5"></path>
                <path d="M14 11v5"></path>
              </svg>

              <span id="studyTrashCount">0</span>
            </button>

            <div id="studyTrashPanel" class="study-trash-panel"></div>
          </div>

          <div id="weeklyStudyDetails"></div>
        </div>

        <p class="note">
          上課沒跟上不可怕，更可怕的是沒跟上還懶得花時間解決問題點。
        </p>
      </section>
    </main>
    <footer>STUDY LEDGER / RECORD THE PROCESS.</footer>
    <script src="script.js"></script>
  </body>
</html>
